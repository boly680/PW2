<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Manuscripts Auction Store</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="login">
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="logo" aria-label="Back to homepage">
            <span class="logo-mark">M</span>
            <span>Manuscripts Auction Store</span>
          </a>
          <h1>Welcome back</h1>
          <p>Sign in to continue exploring rare collections.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrapper">
              <input id="login-password" name="password" type="password" placeholder="Enter your password" />
              <button type="button" class="toggle-password" data-target="login-password">Show</button>
            </div>
          </div>

          <div class="form-row">
            <label class="check-group">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" class="small-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn auth-btn">Login</button>

          <p class="auth-switch">
            Don’t have an account?
            <a href="signup.html">Sign up</a>
          </p>

          <p class="back-link">
            <a href="index.html">Return to homepage</a>
          </p>

          <p id="login-message" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
